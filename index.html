<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>γーPomodoro | Focus & Meditation</title>
    <!-- ✅ PWA: manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- ✅ PWA: テーマカラー（Androidのブラウザタブ・ステータスバー） -->
    <meta name="theme-color" content="#f2f7f4">

    <!-- ✅ iPhone / iOS 対応 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="γ-Pomodoro">
    <link rel="apple-touch-icon" href="icon/icon-192.png">

    <!-- ✅ 一般的なファビコン代替（jpgアイコン流用） -->
    <link rel="icon" href="icon/icon-192.png" type="image/png">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="timer-container">
        <div class="studio-switch">
            <div class="lamp focus-lamp">FOCUS</div>
            <div class="lamp rest-lamp">REST</div>
        </div>
        <div id="display">25:00</div>
    </div>

    <div class="button-group">
        <button onclick="changeTime(-300)">-5</button>
        <button onclick="changeTime(-60)">-1</button>
        <button onclick="changeTime(60)">+1</button>
        <button onclick="changeTime(300)">+5</button>
    </div>

    <div class="control-group">
        <button id="toggle-btn" class="btn-toggle" onclick="toggleTimer()">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>START
        </button>
        <button onclick="resetTimer()">
            <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>RESET
        </button>
    </div>

    <div class="brand-footer">Reepy Works</div>

    <script src="script.js"></script>
</body>
</html>
